name: famsync-local

services:
  database:
    image: supabase/postgres:17.6.1.136
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: famsync-local-admin
      FAMSYNC_LOCAL_DB_PASSWORD: ${FAMSYNC_LOCAL_DB_PASSWORD:-famsync-local-runtime}
    volumes:
      - database:/var/lib/postgresql/data
      - ./supabase/migrations:/famsync/migrations:ro
      - ./supabase/seed.sql:/famsync/seed.sql:ro
      - ./supabase/docker:/famsync/local:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:55431:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:55431
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:famsync-local-auth@database:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/auth/callback/**,http://127.0.0.1:3000/auth/callback/**
      GOTRUE_JWT_SECRET: famsync-local-auth-only-signing-secret-not-for-hosted-use
      GOTRUE_JWT_ISSUER: http://127.0.0.1:55431
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 900
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "${FAMSYNC_GOOGLE_OAUTH_ENABLED:-false}"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: "${FAMSYNC_GOOGLE_CLIENT_ID:-}"
      GOTRUE_EXTERNAL_GOOGLE_SECRET: "${FAMSYNC_GOOGLE_CLIENT_SECRET:-}"
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://127.0.0.1:55431/callback
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: account@famsync.test
      GOTRUE_SMTP_SENDER_NAME: FamSync
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:55434:8025"
      - "127.0.0.1:55435:1025"

  # Local job scheduler. It calls the NestJS endpoint on the host and serves its dashboard on port 8288.
  # Set FAMSYNC_INNGEST_APP_URL when the API runs on a port other than 4000.
  inngest:
    image: inngest/inngest:v1.49.0
    command: ["inngest", "dev", "--no-discovery", "-u", "${FAMSYNC_INNGEST_APP_URL:-http://host.docker.internal:4000/api/inngest}"]
    ports:
      - "127.0.0.1:8288:8288"

  realtime:
    image: supabase/realtime:v2.148.3
    volumes:
      - ./supabase/docker/prepare-realtime.sh:/app/famsync-prepare.sh:ro
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:55437:4000"
    environment:
      PORT: 4000
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: famsync-local-admin
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: famsync-local-auth-only-signing-secret-not-for-hosted-use
      SECRET_KEY_BASE: famsync-local-realtime-secret-key-base-only-not-for-production-0123456789
      METRICS_JWT_SECRET: famsync-local-auth-only-signing-secret-not-for-hosted-use
      ERL_AFLAGS: -proto_dist inet_tcp +S 2:2
      DNS_NODES: "''"
      APP_NAME: realtime
      SELF_HOST_TENANT_NAME: famsync-local
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJmYW1zeW5jLWxvY2FsLXN0b3JhZ2UiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc2NzIyNTYwMCwiZXhwIjoyMTQ3NDgzNjQ3fQ._jmXzIuqn_zOTksUF-kdWCt43HanTJgyzRbk_vpVWeg' http://localhost:4000/api/tenants/famsync-local/health > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

  storage:
    image: supabase/storage-api:v1.81.0
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:55436:5000"
    environment:
      DATABASE_URL: postgres://supabase_storage_admin:famsync-local-storage@database:5432/postgres
      AUTH_JWT_SECRET: famsync-local-auth-only-signing-secret-not-for-hosted-use
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJmYW1zeW5jLWxvY2FsLXN0b3JhZ2UiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc2NzIyNTYwMCwiZXhwIjoyMTQ3NDgzNjQ3fQ._jmXzIuqn_zOTksUF-kdWCt43HanTJgyzRbk_vpVWeg
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJmYW1zeW5jLWxvY2FsLXN0b3JhZ2UiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzY3MjI1NjAwLCJleHAiOjIxNDc0ODM2NDd9.mguNFXWtEF7a2jG3XttADC3PuslZZjcFRyQQR97gMBQ
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: 5242880
      GLOBAL_S3_BUCKET: local
      TENANT_ID: famsync-local
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - attachments:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5000/status"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  database:
  attachments:
