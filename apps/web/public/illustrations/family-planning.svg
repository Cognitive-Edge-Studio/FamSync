<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="title">
  <title id="title">A shared family calendar, checklist and goal, drawn in soft colours</title>
  <!-- Original FamSync illustration: soft pastel shapes on a warm neutral ground. -->
  <rect width="480" height="400" rx="28" fill="#f1f0ec"/>
  <circle cx="392" cy="78" r="38" fill="#ffefd6"/>
  <circle cx="392" cy="78" r="22" fill="#f7d9a8"/>
  <circle cx="70" cy="330" r="54" fill="#e3efd9"/>
  <circle cx="436" cy="338" r="30" fill="#ece8fb"/>
  <!-- Calendar card -->
  <g transform="translate(64 70)">
    <rect width="210" height="196" rx="18" fill="#ffffff" stroke="#e7e7e5" stroke-width="2"/>
    <rect width="210" height="46" rx="18" fill="#292929"/>
    <rect y="28" width="210" height="18" fill="#292929"/>
    <circle cx="44" cy="23" r="6" fill="#ffffff"/>
    <circle cx="166" cy="23" r="6" fill="#ffffff"/>
    <g fill="#f1f0ec">
      <rect x="18" y="64" width="34" height="26" rx="7"/><rect x="62" y="64" width="34" height="26" rx="7"/><rect x="106" y="64" width="34" height="26" rx="7"/><rect x="150" y="64" width="34" height="26" rx="7"/>
      <rect x="18" y="100" width="34" height="26" rx="7"/><rect x="150" y="100" width="34" height="26" rx="7"/>
      <rect x="18" y="136" width="34" height="26" rx="7"/><rect x="62" y="136" width="34" height="26" rx="7"/><rect x="150" y="136" width="34" height="26" rx="7"/>
    </g>
    <rect x="62" y="100" width="78" height="26" rx="7" fill="#e2edf7"/>
    <rect x="106" y="136" width="34" height="26" rx="7" fill="#ece8fb"/>
    <rect x="72" y="110" width="44" height="6" rx="3" fill="#2c5679"/>
  </g>
  <!-- Checklist card -->
  <g transform="translate(236 168)">
    <rect width="186" height="150" rx="18" fill="#ffffff" stroke="#e7e7e5" stroke-width="2"/>
    <g>
      <circle cx="30" cy="36" r="11" fill="#e3efd9"/><path d="m24 36 4.5 4.5L36 32" fill="none" stroke="#3d5a2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="52" y="31" width="104" height="10" rx="5" fill="#e7e7e5"/>
      <circle cx="30" cy="74" r="11" fill="#e3efd9"/><path d="m24 74 4.5 4.5L36 70" fill="none" stroke="#3d5a2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="52" y="69" width="84" height="10" rx="5" fill="#e7e7e5"/>
      <circle cx="30" cy="112" r="10" fill="none" stroke="#c9c8c2" stroke-width="2.5"/>
      <rect x="52" y="107" width="96" height="10" rx="5" fill="#e7e7e5"/>
    </g>
  </g>
  <!-- Goal progress -->
  <g transform="translate(96 292)">
    <rect width="200" height="56" rx="16" fill="#ffffff" stroke="#e7e7e5" stroke-width="2"/>
    <circle cx="28" cy="28" r="14" fill="#fbe6e3"/>
    <path d="M23 21v15m0-15h10l-3 4 3 4H23" fill="none" stroke="#9a3328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="54" y="22" width="126" height="10" rx="5" fill="#f1f0ec"/>
    <rect x="54" y="22" width="80" height="10" rx="5" fill="#9a3328" opacity="0.75"/>
  </g>
</svg>
